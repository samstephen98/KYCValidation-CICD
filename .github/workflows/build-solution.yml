
name: Build KYC Solution

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Package KYC solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-file: out/KYCValidationSolution.zip
          solution-folder: KYCValidationSolution-src
          solution-type: Unmanaged

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYCValidationSolution
          path: out/KYCValidationSolution.zip
