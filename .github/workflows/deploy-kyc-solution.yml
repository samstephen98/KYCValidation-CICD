
name: Deploy KYC Solution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Package managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-file: out/KYCValidationSolution.zip
          solution-folder: KYCValidationSolution-src
          solution-type: Managed

      - name: Import managed solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.POWERPLATFORM_ENVIRONMENT_URL }}
          app-id: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          solution-file: out/KYCValidationSolution.zip
